[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tropmail"
version = "1.1.0"
description = "Official Python SDK for the TropMail API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "TropMail", email = "support@tropmail.com" }]
keywords = ["tropmail", "email", "api", "sdk", "webmail"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "msgspec>=0.18,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[project.urls]
Homepage = "https://tropmail.com"
Documentation = "https://docs.tropmail.com"
Repository = "https://github.com/tropmail/tropmail-python"

[tool.hatch.build.targets.wheel]
packages = ["src/tropmail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tropmail"]
mypy_path = "src"
